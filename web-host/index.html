<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1F18" />
  <title>MiX Showroom</title>
  <style>
    :root {
      --bg: #0f1f18;
      --panel: #162820;
      --card: #1c3228;
      --line: #2e4a3c;
      --cream: #e8e0d0;
      --muted: #9bb0a4;
      --ochre: #d4a84b;
      --sage: #5c9b78;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--cream);
      min-height: 100vh;
      padding: 1rem 1rem 2.5rem;
      max-width: 40rem;
      margin-inline: auto;
    }
    h1 { font-size: 1.75rem; margin: 0 0 0.25rem; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 0.92rem; margin: 0 0 1rem; }
    input[type="search"] {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--cream);
      font-size: 1rem;
      margin-bottom: 0.75rem;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
    .chip {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--cream);
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .chip.active { background: rgba(92,155,120,0.35); border-color: var(--sage); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.9rem 0.95rem;
      margin-bottom: 0.65rem;
    }
    .card h2 { margin: 0 0 0.25rem; font-size: 1.05rem; }
    .card p { margin: 0; color: var(--muted); font-size: 0.88rem; line-height: 1.35; }
    .cat { display: inline-block; margin-top: 0.4rem; font-size: 0.72rem; font-weight: 700; color: var(--sage); text-transform: uppercase; letter-spacing: 0.04em; }
    .row { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.75rem; }
    a.btn, button.btn {
      appearance: none;
      border: none;
      border-radius: 10px;
      padding: 0.55rem 0.85rem;
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: none;
      cursor: pointer;
      color: var(--bg);
      background: var(--ochre);
    }
    button.btn.soft, a.btn.soft {
      background: var(--panel);
      color: var(--cream);
      border: 1px solid var(--line);
    }
    .empty { color: var(--muted); text-align: center; padding: 2rem 1rem; }
  </style>
</head>
<body>
  <h1>MiX Showroom</h1>
  <p class="sub">Portable portfolio — open demos, SMS or share links.</p>
  <input type="search" id="q" placeholder="Search projects…" autocomplete="off" />
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <script>
    const CATALOG = {
      "items": [
        {"id":"fsts","name":"From Seed to Supper","tagline":"Garden companion — web + field apps","category":"Product","url":"https://mixapps.store/from-seed-to-supper/","shareNote":"From Seed to Supper — every seed has a story"},
        {"id":"fsts-app","name":"Seed to Supper (web app)","tagline":"Companion login + garden map","category":"Product","url":"https://mixapps.store/from-seed-to-supper/app/","shareNote":"Open the Seed to Supper garden companion"},
        {"id":"home","name":"MiX Apps home","tagline":"mixapps.store front door","category":"Hub","url":"https://mixapps.store/","shareNote":"MiX Apps — mixapps.store"},
        {"id":"software","name":"Software hub","tagline":"Internal apps / downloads map","category":"Hub","url":"https://mixapps.store/software.html","shareNote":"MiX software hub"},
        {"id":"apps-catalog","name":"Apps catalog","tagline":"Published apps list","category":"Hub","url":"https://mixapps.store/apps.html","shareNote":"MiX apps catalog"},
        {"id":"queenslander","name":"Queenslander Hotel demo","tagline":"Hotel site + bookings","category":"Hotels","url":"https://mixapps.store/queenslander-hotel-demo/","shareNote":"Queenslander Hotel demo — bookings included"},
        {"id":"qld-bookings","name":"Queenslander bookings","tagline":"Direct booking page","category":"Hotels","url":"https://mixapps.store/queenslander-hotel-demo/bookings.html","shareNote":"Book the Queenslander demo"},
        {"id":"mix-booking","name":"MiX Booking","tagline":"Booking product page","category":"Product","url":"https://mixapps.store/mix-booking.html","shareNote":"MiX Booking for hotels & venues"},
        {"id":"carneys","name":"Carney's shop (demo host)","tagline":"Retail / shop demo","category":"Retail","url":"https://demos.mixapps.store/carneys/","shareNote":"Carney's retail demo"},
        {"id":"mixhouse","name":"MixHouse","tagline":"House / ops demo stack","category":"Product","url":"https://demos.mixapps.store/mixhouse/","shareNote":"MixHouse demo"},
        {"id":"shipforge","name":"ShipForge","tagline":"Intent / ship game demo","category":"Games","url":"https://demos.mixapps.store/intent-shipforge/","shareNote":"ShipForge demo"},
        {"id":"mixmods","name":"MixMods free library","tagline":"Rust mods — free singles","category":"Rust","url":"https://mixapps.store/mix-mods-singles.html","shareNote":"MiX free Rust mod library"},
        {"id":"mixpack-page","name":"Mix mod pack page","tagline":"Full pack landing","category":"Rust","url":"https://mixapps.store/mix-mod-pack.html","shareNote":"MiX Rust mod pack"},
        {"id":"demos-root","name":"Demos host root","tagline":"demos.mixapps.store","category":"Hub","url":"https://demos.mixapps.store/","shareNote":"MiX demos host"},
        {"id":"developer","name":"Developer hub","tagline":"Public developer page","category":"Hub","url":"https://mixapps.store/developer.html","shareNote":"MiX developer hub"},
        {"id":"live-backends","name":"Live backends hub","tagline":"Backend demos map","category":"Hub","url":"https://mixapps.store/developer-live-backends.html","shareNote":"MiX live backends"},
        {"id":"downloads","name":"Downloads","tagline":"Public downloads page","category":"Hub","url":"https://mixapps.store/downloads.html","shareNote":"MiX downloads"},
        {"id":"bms","name":"Business Manager","tagline":"MiX AI Business Manager shell","category":"Retail","url":"https://mixapps.store/business-manager/","shareNote":"MiX Business Manager"},
        {"id":"se-patch","name":"SE Patch Day","tagline":"Space Engineers patch notes tool","category":"Product","url":"https://mixapps.store/se-patch-day.html","shareNote":"SE Patch Day"}
      ]
    };

    let category = "All";
    const cats = ["All", ...new Set(CATALOG.items.map(i => i.category)).values()].sort((a,b) => a === "All" ? -1 : b === "All" ? 1 : a.localeCompare(b));
    const chips = document.getElementById("chips");
    const list = document.getElementById("list");
    const q = document.getElementById("q");

    function smsBody(item) {
      const note = item.shareNote || item.name;
      return note + "\n" + item.url;
    }

    function renderChips() {
      chips.innerHTML = cats.map(c =>
        `<button type="button" class="chip ${c === category ? "active" : ""}" data-c="${c}">${c}</button>`
      ).join("");
      chips.querySelectorAll(".chip").forEach(el => {
        el.onclick = () => { category = el.dataset.c; renderChips(); render(); };
      });
    }

    function render() {
      const query = (q.value || "").trim().toLowerCase();
      let items = CATALOG.items.slice();
      if (category !== "All") items = items.filter(i => i.category === category);
      if (query) {
        items = items.filter(i =>
          (i.name + " " + i.tagline + " " + i.category + " " + i.url).toLowerCase().includes(query)
        );
      }
      if (!items.length) {
        list.innerHTML = `<p class="empty">No projects match</p>`;
        return;
      }
      list.innerHTML = items.map(item => {
        const body = encodeURIComponent(smsBody(item));
        const sms = `sms:?body=${body}`;
        return `<article class="card">
          <h2>${item.name}</h2>
          <p>${item.tagline}</p>
          <span class="cat">${item.category}</span>
          <div class="row">
            <a class="btn" href="${item.url}" target="_blank" rel="noopener">Open</a>
            <a class="btn soft" href="${sms}">SMS</a>
            <button type="button" class="btn soft" data-copy="${item.url}">Copy</button>
            <button type="button" class="btn soft" data-share="${item.id}">Share</button>
          </div>
        </article>`;
      }).join("");

      list.querySelectorAll("[data-copy]").forEach(btn => {
        btn.onclick = async () => {
          try {
            await navigator.clipboard.writeText(btn.dataset.copy);
            btn.textContent = "Copied";
            setTimeout(() => btn.textContent = "Copy", 1200);
          } catch {
            prompt("Copy link:", btn.dataset.copy);
          }
        };
      });
      list.querySelectorAll("[data-share]").forEach(btn => {
        btn.onclick = async () => {
          const item = CATALOG.items.find(i => i.id === btn.dataset.share);
          if (!item) return;
          const text = smsBody(item);
          if (navigator.share) {
            try { await navigator.share({ title: item.name, text, url: item.url }); return; } catch (_) {}
          }
          try {
            await navigator.clipboard.writeText(text);
            alert("Share text copied");
          } catch {
            prompt("Share:", text);
          }
        };
      });
    }

    q.addEventListener("input", render);
    renderChips();
    render();
  </script>
</body>
</html>
