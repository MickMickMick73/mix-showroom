# MiX Showroom â€” portable portfolio for iPhone (TestFlight)
# Env group "global": same ASC signing secrets as Seed to Supper / SpeakEasy

workflows:
  showroom-ios:
    name: MiX Showroom iOS
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - global
      vars:
        BUNDLE_ID: store.mixapps.showroom
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: |
          set -e
          flutter pub get
          flutter precache --ios
      - name: Verify bundle ID
        script: |
          set -e
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}" ios/Runner.xcodeproj/project.pbxproj
      - name: Install pods
        script: |
          set -e
          if [ ! -f ios/Podfile ]; then
            echo "No Podfile — skip"
            exit 0
          fi
          # Strip UTF-8 BOM that Windows editors sometimes add (breaks CocoaPods/xcodeproj)
          python3 - <<'PY'
          from pathlib import Path
          for p in Path("ios").rglob("*"):
              if not p.is_file():
                  continue
              if p.suffix.lower() not in {".pbxproj", ".plist", ".xcconfig", ".rb", ".swift", ""} and p.name not in {"Podfile", "Podfile.lock"}:
                  if p.suffix.lower() not in {".pbxproj", ".plist", ".xcconfig"} and p.name not in {"Podfile", "Podfile.lock"}:
                      continue
              data = p.read_bytes()
              if data.startswith(b"\xef\xbb\xbf"):
                  p.write_bytes(data[3:])
                  print("stripped BOM", p)
          PY
          cd ios
          test -f Flutter/Generated.xcconfig
          pod install --repo-update
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          set -e
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --platform IOS \
            --create
      - name: Add certificates
        script: keychain add-certificates
      - name: Use profiles
        script: |
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --export-options-plist $HOME/export_options.plist
      - name: Build IPA
        script: |
          set -e
          flutter build ipa --release \
            --export-options-plist=$HOME/export_options.plist \
            --build-name=1.0.0 \
            --build-number=${BUILD_NUMBER:-${PROJECT_BUILD_NUMBER:-$(date +%Y%m%d%H%M)}}
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  showroom-android:
    name: MiX Showroom Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
